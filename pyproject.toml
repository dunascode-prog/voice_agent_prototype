[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time phone voice agent prototype (Twilio + Pipecat + Deepgram + Claude + Cartesia)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[anthropic,deepgram,cartesia,silero,websocket]>=1.17,<2",
    # Claude on Amazon Bedrock (SigV4 signing via boto3). Keep <2 while any Bedrock model older
    # than Claude 4.7 is used: 2.x sends API version 2026-10-21, which Bedrock rejects for them.
    "anthropic[bedrock]>=1.17,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "twilio>=9.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "fakeredis>=2.23",
]

[project.scripts]
voice-gateway = "voice_agent.gateway.app:main"
voice-agent = "voice_agent.pipeline.server:main"
voice-dev = "voice_agent.dev:main"
voice-maintenance = "voice_agent.storage.maintenance:main"
voice-llm-check = "voice_agent.llm_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs real provider credentials and network"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S314", "S603"]  # fake secrets, own TwiML, fixed alembic argv
